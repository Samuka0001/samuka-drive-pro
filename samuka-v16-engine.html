<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/mediabunny@1.65.0/dist/bundles/mediabunny.min.mjs; connect-src 'none'; img-src 'none'; media-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'; worker-src 'none'; frame-src 'none'"><title>Samuka media sandbox</title></head><body><script type="module">
const ORIGIN='https://samuka0001.github.io';let used=false;
window.addEventListener('message',async e=>{if(e.source!==parent||e.origin!==ORIGIN||used||e.data?.kind!=='convert16'||!(e.data.blob instanceof Blob)||typeof e.data.id!=='string')return;used=true;const {id,blob,options}=e.data;const send=(kind,p={})=>parent.postMessage({kind,id,...p},ORIGIN);const progress=(stage,pct=null)=>send('progress16',{stage,pct});let input,output,verification;try{
 if(blob.size<=0||blob.size>500000000)throw Error('Limite de entrada: 500 MB.');progress('Carregando biblioteca Mediabunny');
 const M=await import('https://cdn.jsdelivr.net/npm/mediabunny@1.65.0/dist/bundles/mediabunny.min.mjs');
 progress('Analisando vídeo e áudio');input=new M.Input({formats:M.ALL_FORMATS,source:new M.BlobSource(blob)});const v=await input.getPrimaryVideoTrack(),a=await input.getPrimaryAudioTrack();if(!v)throw Error('Nenhuma faixa de vídeo reconhecida.');const origDuration=await input.computeDuration();if(!Number.isFinite(origDuration)||origDuration<=0)throw Error('Duração de origem não reconhecida.');const codec=t=>typeof t.getCodec==='function'?t.getCodec():t.codec;const dim=async(t,axis)=>typeof t['getDisplay'+axis]==='function'?t['getDisplay'+axis]():t['display'+axis.toLowerCase().replace(/^./,x=>x.toUpperCase())];const w=await dim(v,'Width'),h=await dim(v,'Height');if(!w||!h||w*h>34000000)throw Error('Resolução não suportada ou muito grande.');const video={codec:'avc'},audio={codec:'aac'};const q=options?.quality;const max=q==='1080'?1080:q==='720'||q==='compact'?720:0;if(max&&Math.min(w,h)>max){if(w>=h)video.height=max;else video.width=max;video.fit='contain'}if(q==='compact'){video.bitrate=2500000;audio.bitrate=128000;video.forceTranscode=true;}const fps=Number(options?.fps);if([24,30,60].includes(fps))video.frameRate=fps;
 output=new M.Output({format:new M.Mp4OutputFormat({fastStart:false}),target:new M.BufferTarget()});const c=await M.Conversion.init({input,output,video,audio});if(!c.isValid||c.discardedTracks?.some(x=>x.track===v||x.track===a||x.track?.isVideoTrack?.()||x.track?.isAudioTrack?.()))throw Error('Não foi possível preservar todas as faixas de vídeo e áudio. Codec ou codificador incompatível.');progress('Convertendo para MP4',0);c.onProgress=p=>progress('Convertendo para MP4',Math.min(99,Math.max(0,p*100)));await c.execute();progress('Verificando arquivo resultante');const buffer=output.target.buffer;if(!(buffer instanceof ArrayBuffer)||!buffer.byteLength||buffer.byteLength>750000000)throw Error('Arquivo de saída vazio ou grande demais.');const result=new Blob([buffer],{type:'video/mp4'});verification=new M.Input({formats:M.ALL_FORMATS,source:new M.BlobSource(result)});const vv=await verification.getPrimaryVideoTrack(),aa=await verification.getPrimaryAudioTrack(),duration=await verification.computeDuration();if(!vv||await codec(vv)!=='avc'||(a&&!aa)||(aa&&await codec(aa)!=='aac')||!Number.isFinite(duration)||Math.abs(duration-origDuration)>Math.max(1,origDuration*.015))throw Error('Verificação de duração ou codecs falhou. Resultado não disponibilizado.');const width=await dim(vv,'Width'),height=await dim(vv,'Height');if(!width||!height)throw Error('Dimensões de saída inválidas.');send('result16',{blob:result,meta:{width,height,duration,video:'avc',audio:aa?'aac':'sem áudio'}});
 }catch(err){send('error16',{error:String(err?.message||err).slice(0,500)})}finally{try{input?.dispose?.();verification?.dispose?.()}catch{}}});
parent.postMessage({kind:'ready16'},ORIGIN);
</script></body></html>
