<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estúdio • Samuka</title><link rel="stylesheet" href="estudio/style.css"><script src="https://accounts.google.com/gsi/client" async defer></script><body><header><a class="brand" href="samuka-beta.html"><img src="samuka-mono-192.png" alt="">Samuka</a><nav><a href="samuka-v17-rc3.html">Drive</a><b>Estúdio</b></nav><button id="connect">Conectar Google</button></header><main><h1>Estúdio</h1><p id="message" role="status">Conecte a conta do Drive que você usa no Windows.</p><div class="workspace"><section><h2>Importar links</h2><label for="links">Links do YouTube, um por linha</label><textarea id="links" rows="4" placeholder="https://www.youtube.com/watch?v=…"></textarea><label>Pasta de destino <select id="folder" disabled><option>Conecte o Drive</option></select></label><div class="folder-actions"><button id="back" disabled>Subir uma pasta</button><button id="newFolder" disabled>+ Nova pasta</button></div>
<dialog id="folderDialog"><form id="folderForm"><h2>Criar pasta</h2><p id="folderParent"></p><label for="folderName">Nome da pasta</label><input id="folderName" required maxlength="200" autocomplete="off"><p id="folderError" role="alert"></p><div class="folder-actions"><button type="button" id="cancelFolder">Cancelar</button><button class="primary" id="createFolder">Criar e usar</button></div></form></dialog><p id="path">Meu Drive</p><button class="primary" id="send">Adicionar à fila</button><details><summary>Configurar Windows</summary><p>Copie o código da fila para a configuração do programa no computador.</p><input id="pair" readonly aria-label="Código da fila"><a href="estudio/windows/LEIA-ME.txt">Instruções para Windows</a></details><h2>Fila</h2><button id="refresh">Atualizar fila</button><div id="jobs"></div></section><section id="editor"><h2>Prévia e corte</h2><p id="title">Selecione um vídeo pronto na fila.</p><video controls playsinline id="video"></video><div class="times"><label>Início (segundos)<input type="number" id="start" min="0" step=".01" value="0"><button id="markStart">Marcar início aqui</button></label><label>Fim (segundos)<input id="end" type="number" min="0" step=".01"><button id="markEnd">Marcar fim aqui</button></label></div><button class="primary" id="cut">Salvar corte no Drive</button></section></div></main><script type="module" src="estudio/app.js"></script></body></html>
